<style>
:root{
  --glass: rgba(255,255,255,.62); --stroke: rgba(255,255,255,.72);
  --ink:#0d2238; --ink2:#3a536d; --accent:#0ea5e9;
  --shadow: 0 12px 40px rgba(12,42,80,.22), 0 2px 6px rgba(12,42,80,.10);
  --radius: 20px;
  --font: "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#b9cfe0;font-family:var(--font);color:var(--ink);-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0;overflow:hidden;user-select:none;-webkit-user-select:none}
#app canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(170%);backdrop-filter:blur(18px) saturate(170%);border:1px solid var(--stroke);box-shadow:var(--shadow);border-radius:var(--radius)}

#titleCard{position:absolute;top:14px;left:14px;padding:10px 18px 10px 12px;display:flex;gap:12px;align-items:center;z-index:5;max-width:calc(100% - 28px)}
#titleCard .logo{width:46px;height:46px;flex:none;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,#fbbf24,#b45309);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 4px 12px rgba(180,83,9,.35)}
#titleCard h1{margin:0;font-size:21px;font-weight:900;letter-spacing:.04em;line-height:1.2}
#titleCard p{margin:2px 0 0;font-size:13.5px;color:var(--ink2);font-weight:500}
.tag-sample{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:8px;background:#f59e0b;color:#fff;font-size:12px;vertical-align:3px}

#era{position:absolute;top:14px;left:50%;transform:translateX(-50%);display:flex;gap:4px;padding:6px;z-index:5}
#era button{padding:9px 18px;border-radius:14px;font-size:16px;font-weight:900;color:var(--ink2);line-height:1.15;text-align:center}
#era button small{display:block;font-size:11.5px;font-weight:700;opacity:.8}
#era button.on{background:var(--ec);color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.18)}

#views{position:absolute;left:14px;bottom:14px;display:flex;gap:6px;padding:7px;z-index:5;max-width:calc(100% - 28px);overflow-x:auto;scrollbar-width:none}
.vw{flex:none;display:flex;align-items:center;gap:7px;padding:8px 13px 8px 8px;border-radius:14px;font-size:15px;font-weight:700;transition:background .2s,transform .2s,opacity .2s}
.vw b{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:14px;background:var(--c)}
.vw:hover{background:rgba(255,255,255,.7)} .vw.active{background:#fff;transform:translateY(-2px)}
.vw[hidden]{display:none}

#labels{position:absolute;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.lbl{position:absolute;left:0;top:0;white-space:nowrap;will-change:transform;transition:opacity .25s}
.lbl.hide{opacity:0}
.pin{pointer-events:auto;display:flex;align-items:center;gap:6px;padding:4px 11px 4px 4px;border-radius:999px;font-size:14.5px;font-weight:900;background:rgba(255,255,255,.88);box-shadow:0 4px 14px rgba(0,30,60,.25);cursor:pointer;transform:translate(-50%,-100%)}
.pin b{min-width:22px;height:22px;padding:0 5px;border-radius:11px;display:grid;place-items:center;color:#fff;font-size:12px;background:var(--c,#475569)}
.pin::after{content:"";position:absolute;left:50%;bottom:-7px;width:2px;height:7px;background:rgba(255,255,255,.9);transform:translateX(-50%)}
.geo{padding:3px 10px;border-radius:9px;font-size:14px;font-weight:800;color:#fff;background:rgba(13,34,56,.55);text-shadow:0 1px 2px rgba(0,0,0,.4);transform:translate(-50%,-50%)}
.geo.water{background:rgba(3,105,161,.62)} .geo.canal{background:rgba(185,28,28,.62)} .geo.old{background:rgba(146,64,14,.72)}

#panel{position:absolute;top:96px;right:14px;width:min(390px,calc(100% - 28px));max-height:calc(100% - 180px);overflow:auto;padding:18px 20px;z-index:6;transform:translateX(120%);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
#panel.open{transform:none}
#panel h2{margin:0 0 4px;font-size:21px;font-weight:900}
#panel .sub{font-size:13px;color:var(--ink2);margin-bottom:10px}
#panel p{font-size:15.5px;line-height:1.75;margin:8px 0}
#panel .x{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;font-size:20px;font-weight:900;color:var(--ink2)}
#panel .x:hover{background:rgba(255,255,255,.7)}
#panel .bk{display:inline-block;margin:0 0 10px;padding:6px 14px;border-radius:12px;background:#fff;color:#0369a1;font-size:14.5px;font-weight:900;box-shadow:0 2px 8px rgba(0,30,60,.15)}
#panel .bk[hidden]{display:none}
body.tl-open #legend,body.tl-open #flood{display:none}
#flood{position:absolute;left:14px;bottom:74px;padding:10px 12px;z-index:5;width:min(300px,calc(100% - 28px));font-size:14px;line-height:1.55}
#flood[hidden]{display:none}
#flood b{font-size:15px}
#flood .fb{display:flex;gap:6px;margin:6px 0 4px}
#flood .fb button{flex:1;padding:8px 6px;border-radius:12px;font-size:14.5px;font-weight:900;color:#fff;background:#b45309}
#flood .fb button:disabled{opacity:.4;cursor:default}
#flood .fb button.re{background:#0369a1}
#flood small{display:block;color:var(--ink2);font-size:12.5px}
body.dbg #flood{display:none !important}
.mvmap{display:block;width:100%;height:auto;border-radius:12px;background:#eef3ee;margin:6px 0}
.mvstep{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}
.mvstep button{padding:7px 6px;border-radius:10px;background:#f1f5f9;font-size:13.5px;font-weight:900;text-align:left}
.mvstep button.on{background:#0f766e;color:#fff}
.gdia{display:block;width:100%;height:auto;margin:10px 0 4px;border-radius:12px;background:#f1ede4}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;font-size:15px;margin-top:10px;line-height:1.6}
.keys span:nth-child(odd){font-weight:900;color:#7c4a12;white-space:nowrap}
.src{font-size:12.5px;color:#64748b;line-height:1.6;margin-top:12px;border-top:1px solid rgba(100,116,139,.25);padding-top:8px}
.src a{color:#0369a1}

#legend{position:absolute;right:14px;bottom:44px;padding:10px 14px;z-index:5;font-size:13.5px;font-weight:700;display:grid;gap:5px;max-width:260px}
#legend i{display:inline-block;width:22px;height:8px;border-radius:4px;margin-right:8px;vertical-align:1px}

#credit{position:absolute;right:10px;bottom:6px;z-index:5;font-size:11px;color:rgba(255,255,255,.92);text-shadow:0 1px 2px rgba(0,0,0,.7);text-align:right;max-width:70%}
#loading{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:linear-gradient(160deg,#dbe8f2,#b9cfe0);transition:opacity .6s}
#loading div{font-size:17px;font-weight:700;color:var(--ink2)}
#loading.done{opacity:0;pointer-events:none}
@media (max-width:820px){#titleCard{display:none}#era{top:10px}#legend{display:none}#credit{max-width:92%}}
#tl{position:absolute;left:50%;bottom:74px;transform:translateX(-50%);width:min(900px,calc(100% - 28px));padding:12px 16px 14px;z-index:7}
#tl[hidden]{display:none}
#tl .x{position:absolute;top:6px;right:8px;width:32px;height:32px;border-radius:50%;font-size:19px;font-weight:900;color:var(--ink2)}
#tl h3{margin:0 0 8px;font-size:16px;font-weight:900}
#tl h3 small{font-size:12.5px;font-weight:500;color:var(--ink2);margin-left:8px}
#tlTrack{display:flex;overflow-x:auto;padding:4px 0 6px;scrollbar-width:thin}
.tn{flex:1 0 82px;position:relative;padding:20px 4px 6px;text-align:center;font-size:13px;font-weight:700;color:var(--ink2);border-radius:12px;line-height:1.35}
.tn::before{content:"";position:absolute;left:0;right:0;top:9px;height:3px;background:rgba(100,116,139,.35)}
.tn::after{content:"";position:absolute;left:50%;top:3px;width:15px;height:15px;margin-left:-7.5px;border-radius:50%;background:var(--tc);border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.tn b{display:block;font-size:15px;font-weight:900;color:var(--ink)}
.tn.on{background:#fff;box-shadow:0 2px 10px rgba(0,30,60,.15)}
#tlText{margin-top:8px;font-size:15px;line-height:1.7;min-height:52px}
#tlText .oral{display:inline-block;margin-right:6px;padding:0 7px;border-radius:7px;background:#fde68a;color:#78350f;font-size:12px;font-weight:900;vertical-align:1px}
.oral{display:inline-block;margin-right:6px;padding:0 7px;border-radius:7px;background:#fde68a;color:#78350f;font-size:12px;font-weight:900;vertical-align:1px}
.more{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.more button{padding:7px 12px;border-radius:12px;background:#92400e;color:#fff;font-size:14px;font-weight:900}
body.dbg #titleCard,body.dbg #era,body.dbg #views,body.dbg #legend,body.dbg #credit,body.dbg .navrow{display:none !important}
</style>

<body>
<div id="app"></div>
<div id="labels"></div>

<div id="titleCard" class="glass">
  <div class="logo"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2"/></svg></div>
  <div><h1>古今八堡圳</h1><p>同一個圳頭，三個時代怎麼取水</p></div>
</div>

<div id="era" class="glass">
  <button data-era="qing" style="--ec:#92400e">清代<small>石笱・土圳</small></button>
  <button data-era="jp" style="--ec:#475569">日治<small>水門＋石笱</small></button>
  <button data-era="now" style="--ec:#0369a1">現代<small>集集攔河堰</small></button>
</div>

<div id="views" class="glass">
  <button class="vw" data-v="overview" style="--c:#0284c7"><b>1</b>圳頭全景</button>
  <button class="vw" data-v="intake" style="--c:#b45309"><b>2</b>取水口</button>
  <button class="vw" data-v="split" style="--c:#dc2626"><b>3</b>分水</button>
  <button class="vw" data-v="gou" style="--c:#a16207"><b>4</b>石笱近看</button>
  <button class="vw" id="tlBtn" style="--c:#7c3aed"><b>年</b>時間軸</button>
  <button class="vw" id="moveBtn" style="--c:#0f766e"><b>搬</b>圳頭搬家</button>
</div>

<div id="legend" class="glass"></div>

<aside id="panel" class="glass">
  <button class="x" aria-label="關閉">×</button>
  <button class="bk" hidden>‹ 返回上一張</button>
  <h2 id="pTitle"></h2><div class="sub" id="pSub"></div><div id="pBody"></div>
</aside>

<div id="flood" class="glass" hidden>
  <b>石笱壩要一直重做</b>
  <div class="fb"><button id="fGo">大水來了</button><button id="fRe" class="re" disabled>水退了，重新排</button></div>
  <div id="fTxt">濁水溪每次發大水，石笱壩都可能被沖壞。按按看。</div>
  <small id="fCnt"></small>
</div>

<div id="tl" class="glass" hidden>
  <button class="x" aria-label="關閉">×</button>
  <h3>八堡圳時間軸<small>點年份看那時候發生的事；有顏色的年份會切換畫面</small></h3>
  <div id="tlTrack"></div><div id="tlText"></div>
</div>

<div id="credit">地形：內政部20公尺網格DEM｜影像：國土測繪中心正射影像（現代）｜古河道：依中研院人社中心GIS專題中心〈臺灣百年歷史地圖〉臺灣堡圖（1904）描繪｜圖資：© OpenStreetMap 貢獻者｜材質與天空：Poly Haven (CC0)｜畫面為教學示意</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* =====================================================================
   座標系同 sample_b：1 單位 = 1 公尺；local x 向東、z 向南（自區域 B 西北角），
   world = local − (CX, CZ)，y = 高程 − BASE_H
   ===================================================================== */
const DATA = 'data/', TEX = 'assets/tex/';
const BASE_H = 95, CX = 2200, CZ = 2400;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
function rng(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

async function loadGrid(name) {
  const meta = await (await fetch(DATA + `meta_${name}.json`)).json();
  const buf = await (await fetch(DATA + `dem_${name}.f32`)).arrayBuffer();
  return { meta, H: new Float32Array(buf) };
}
const texLoader = new THREE.TextureLoader();
const loadTex = (url, srgb = false, rep = true) => new Promise(res => texLoader.load(url, t => {
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  if (rep) t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = 8; res(t);
}));
function sampler(grid) {
  const { nx, ny, cell } = grid.meta, H = grid.H;
  const at = (i, j) => H[clamp(j, 0, ny - 1) * nx + clamp(i, 0, nx - 1)];
  const cr = (p0, p1, p2, p3, t) => p1 + 0.5 * t * (p2 - p0 + t * (2 * p0 - 5 * p1 + 4 * p2 - p3 + t * (3 * (p1 - p2) + p3 - p0)));
  return (lx, lz) => {
    const fx = lx / cell, fz = lz / cell, i = Math.floor(fx), j = Math.floor(fz), tx = fx - i, tz = fz - j;
    const r = []; for (let k = -1; k <= 2; k++) r.push(cr(at(i - 1, j + k), at(i, j + k), at(i + 1, j + k), at(i + 2, j + k), tx));
    return cr(r[0], r[1], r[2], r[3], tz);
  };
}
function chaikin(pts, n) {
  for (let k = 0; k < n; k++) {
    const o = [pts[0]];
    for (let i = 0; i < pts.length - 1; i++) { const a = pts[i], b = pts[i + 1]; o.push([a[0] * .75 + b[0] * .25, a[1] * .75 + b[1] * .25], [a[0] * .25 + b[0] * .75, a[1] * .25 + b[1] * .75]); }
    o.push(pts[pts.length - 1]); pts = o;
  }
  return pts;
}
function resample(pts, step) {
  const out = [pts[0]]; let carry = 0;
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i], b = pts[i + 1], L = Math.hypot(b[0] - a[0], b[1] - a[1]);
    let d = step - carry;
    while (d <= L) { const t = d / L; out.push([lerp(a[0], b[0], t), lerp(a[1], b[1], t)]); d += step; }
    carry = L - (d - step);
  }
  if (out.length < 2 || Math.hypot(out[out.length - 1][0] - pts[pts.length - 1][0], out[out.length - 1][1] - pts[pts.length - 1][1]) > 0.5) out.push(pts[pts.length - 1]);
  return out;
}

/* =====================================================================
   主程式
   ===================================================================== */
let renderer, scene, camera, controls, sun, clock = new THREE.Clock();
let heightAt, terrainMat, eraMaskTex;
const labels = [], waterTex = [];
const ERA = { cur: 'qing', groups: { qing: [], jp: [], now: [] }, river: null };
const U = { uQing: { value: 1 }, uJp: { value: 0 }, uTime: { value: 0 } };   // 地表 shader 的時代權重
let MOVE = null, GATE_J = [3329, 1351], OLD, OSM, GATE, GOU_SITE, OUTER_H, GOU_ANIM = null, HEADOSM, HEAD_LABELS = [], HEAD_POOLS;

init();

async function init() {
  const [gB, gO, osm, old] = await Promise.all([loadGrid('b'), loadGrid('o'), fetch(DATA + 'osm_b.json').then(r => r.json()), fetch(DATA + 'era1904.json', { cache: 'no-cache' }).then(r => r.json())]);
  OSM = osm; OLD = Object.fromEntries(old.lines.map(l => [l.id, l.pts]));
  { const HB = [3380, 1400], DV = [-60, -45], R = 700;          // 1904 堡圖的圳頭 (3380,1400) → 1913 年實測圖的圳頭 (3320,1355)，越遠修越少
    for (const k of ['A', 'B', 'C', 'D']) OLD[k] = OLD[k].map(p => { const w = Math.max(0, 1 - Math.hypot(p[0] - HB[0], p[1] - HB[1]) / R); return [p[0] + DV[0] * w, p[1] + DV[1] * w]; }); }
  HEADOSM = await fetch(DATA + 'osm_head.json', { cache: 'no-cache' }).then(r => r.json());
  MOVE = await fetch(DATA + 'move_map.json', { cache: 'no-cache' }).then(r => r.json());
  setupRenderer();
  const envP = new RGBELoader().loadAsync('assets/hdri/sky_2k.hdr').then(hdr => {
    hdr.mapping = THREE.EquirectangularReflectionMapping;
    scene.background = hdr; scene.backgroundIntensity = 0.95;
    const pm = new THREE.PMREMGenerator(renderer); scene.environment = pm.fromEquirectangular(hdr).texture;
  });
  const river = buildRiverPath(osm, gB);
  const terrB = buildTerrainB(gB, river);
  eraMaskTex = buildEraMask();
  await Promise.all([envP, buildMaterialsAndTerrain(terrB)]);
  await buildOuter(gO, gB);
  ERA.river = await buildWater(river);
  ERA.groups.jp.push(ERA.river); ERA.groups.now.push(ERA.river);
  buildCanalsAllEras();
  buildGates();
  buildHeadNow();
  await buildShigouArc();
  buildLabels();
  setupUI();
  const q = new URLSearchParams(location.search);
  setEra(q.get('era') || 'qing', false);
  flyTo(q.get('view') || 'overview', 0);
  if (q.get('card')) openPanel(q.get('card'));                   // 除錯：直接打開某張說明卡
  { const dc = q.get('dbgcam');                                   // 除錯：?dbgcam=gate:-40,30,45（物件標記:相機相對位置），離線截圖用
    if (dc) { const [k, o] = dc.split(':'), off = o.split(',').map(Number), ob = ERA.groups[ERA.cur].find(x => x.userData && x.userData.tag === k);
      if (ob) { controls.target.set(ob.position.x, ob.position.y + 3, ob.position.z); camera.position.set(ob.position.x + off[0], ob.position.y + 3 + off[1], ob.position.z + off[2]); controls.update(); placeSunShadow(controls.target, 120); document.body.classList.add('dbg'); } } }
  const ld = document.getElementById('loading'); ld.classList.add('done'); setTimeout(() => ld.remove(), 700);
  renderer.setAnimationLoop(frame);
  window.__era = { scene, camera, controls, renderer, setEra, flyTo, U, ERA, eraMaskTex };   // 除錯用
}

function setupRenderer() {
  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.85;
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.getElementById('app').appendChild(renderer.domElement);
  scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0xd3d9db, 7000, 17000);
  camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.3, 30000);
  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.dampingFactor = 0.08;
  controls.maxPolarAngle = Math.PI * 0.49; controls.minDistance = 4; controls.maxDistance = 16000;
  controls.screenSpacePanning = false;
  sun = new THREE.DirectionalLight(0xfff1dd, 2.6);
  sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.04;
  scene.add(sun, sun.target);
  scene.add(new THREE.HemisphereLight(0xcfe3ff, 0x6b5a3e, 0.35));
  addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

const _v = new THREE.Vector3();
function updateLabels() {
  const w = innerWidth, h = innerHeight, used = [];
  for (const L of labels) {
    _v.copy(L.pos).project(camera);
    let vis = L.eras.includes(ERA.cur) && _v.z < 1 && Math.abs(_v.x) < 1.1 && Math.abs(_v.y) < 1.1 && camera.position.distanceTo(L.pos) < L.maxDist;
    if (vis) {                                                          // 標籤互相重疊時，後面的（不能點的）先藏起來
      const sx = (_v.x * .5 + .5) * w, sy = (-_v.y * .5 + .5) * h, bw = (L.bw || (L.bw = L.el.firstChild.offsetWidth || 120)) / 2 + 5;
      const r = L.pin ? [sx - bw, sy - 44, sx + bw, sy + 2] : [sx - bw, sy - 18, sx + bw, sy + 18];
      if (used.some(u => r[0] < u[2] && r[2] > u[0] && r[1] < u[3] && r[3] > u[1])) vis = false;
      else { used.push(r); L.el.style.transform = `translate(${sx}px,${sy}px)`; }
    }
    L.el.classList.toggle('hide', !vis);
  }
}

function gouDiagram() {
  // 依老師提供的〈三種石笱各在哪裡〉圖（暫訂版，導覽錄音/圖2）：水由左往右流；壩的石笱錐身順著水流、大口朝上游，
  // 一個挨一個斜疊到圳口下游側（外側十尺導水、靠圳口十二尺引水）；八尺固堤排在圳道兩岸，大口朝水道、尖端朝外
  const tri = (bx, by, ux, uy, len, wd, col) => { const px = -uy * wd / 2, py = ux * wd / 2;   // (bx,by)＝大口中心，(ux,uy)＝往尖端的方向
    return `<polygon points="${(bx + px).toFixed(1)},${(by + py).toFixed(1)} ${(bx - px).toFixed(1)},${(by - py).toFixed(1)} ${(bx + ux * len).toFixed(1)},${(by + uy * len).toFixed(1)}" fill="${col}" fill-opacity=".28" stroke="${col}" stroke-width="1.6" stroke-linejoin="round"/>`; };
  const BANK = 150, ux = 0.781, uy = -0.625;                       // 圳道方向（往右上）
  const L0 = [285, BANK], R0 = [385, BANK], lenC = 170;            // 圳口左、右岸
  let g = '';
  // 八尺・固堤：圳道兩岸，大口貼著圳岸、尖端往外
  for (let i = 0; i < 8; i++) g += tri(L0[0] + ux * (22 + i * 19), L0[1] + uy * (22 + i * 19), uy, -ux, 40, 15, '#059669');   // 左岸：尖端往左上
  for (let i = 0; i < 6; i++) g += tri(R0[0] + ux * (60 + i * 19), R0[1] + uy * (60 + i * 19), -uy, ux, 40, 15, '#059669');   // 右岸：尖端往右下（從河岸線以上開始，不伸進溪裡）
  // 壩：大口朝上游（左），尖端朝下游（右），從河床外側斜疊到圳口下游側
  const D0 = [262, 272], D1 = [392, 163], N = 9;
  for (let i = 0; i < N; i++) { const t = i / (N - 1), x = D0[0] + (D1[0] - D0[0]) * t, y = D0[1] + (D1[1] - D0[1]) * t, big = i >= N - 3;
    g += tri(x, y, 1, 0, big ? 62 : 52, big ? 21 : 17, big ? '#2563eb' : '#ea580c'); }

  const flow = [[183, 330], [213, 300], [243, 270]].map(([y, bx]) => { const ex = bx + ux * 190, ey = y + uy * 190;

    <rect x="0" y="${BANK}" width="660" height="160" fill="#dfe9ef"/>
    <polygon points="${L0} ${L0[0] + ux * lenC},${L0[1] + uy * lenC} ${R0[0] + ux * lenC},${R0[1] + uy * lenC} ${R0}" fill="#dfe9ef"/>
    <path d="M0 ${BANK} L${L0} L${L0[0] + ux * lenC} ${L0[1] + uy * lenC}" fill="none" stroke="#a8a29e" stroke-width="2"/>
    <path d="M660 ${BANK} L${R0} L${R0[0] + ux * lenC} ${R0[1] + uy * lenC}" fill="none" stroke="#a8a29e" stroke-width="2"/>
    ${flow}
    <path d="M40 296 L620 296" stroke="#475569" stroke-width="2"/><polygon points="632,296 618,290 618,302" fill="#475569"/>
    ${g}
    <g font-family="inherit" font-weight="900" font-size="15">
      <text x="14" y="${BANK - 8}" font-size="12.5" font-weight="700" fill="#78716c">河岸</text><text x="612" y="${BANK - 8}" font-size="12.5" font-weight="700" fill="#78716c">河岸</text>
      <text x="14" y="236" fill="#0d2238">濁水溪</text><text x="44" y="176" font-size="12" font-weight="700" fill="#475569">水流方向 →</text>
      <text x="470" y="44" fill="#0d2238">八堡圳</text>
      <text x="112" y="58" fill="#047857">八尺・固堤</text><text x="112" y="76" font-size="12.5" font-weight="700" fill="#334155">圳道兩岸，大口朝水道</text>
      <text x="474" y="184" fill="#1d4ed8">十二尺・引水</text><text x="474" y="202" font-size="12.5" font-weight="700" fill="#334155">圳口挖深處，水較深</text>
      <text x="420" y="250" fill="#c2410c">十尺・導水</text><text x="420" y="268" font-size="12.5" font-weight="700" fill="#334155">河床上，先把水攔緩</text>
      <text x="380" y="322" font-size="12.5" font-weight="700" fill="#64748b">沒被攔下的水繼續往下游</text>
    </g></svg>`;
}

function setupTimeline() {
  const box = document.getElementById('tl'), track = document.getElementById('tlTrack'), text = document.getElementById('tlText');

    const [y, era, t, d] = TL[i];
    track.querySelectorAll('.tn').forEach((n, k) => n.classList.toggle('on', k === i));
    text.innerHTML = `<strong>${y}　${t}</strong><br>${d}`;

  track.querySelectorAll('.tn').forEach((n, i) => n.addEventListener('click', () => pick(i)));

function openPanel(key, mode) {
