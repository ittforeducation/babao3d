<style>

</style>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';
import { Line2 } from 'three/addons/lines/Line2.js';
import { LineMaterial } from 'three/addons/lines/LineMaterial.js';
import { LineGeometry } from 'three/addons/lines/LineGeometry.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* =====================================================================
   階段 5 校園周邊（場景 C）樣張
   座標：1 單位 = 1 公尺；local x 向東、z 向南（自 meta_s 西北角）；world = local − (CX, CZ)，y = 高程
   資料：data/dem_s.f32＋meta_s.json（20 m）、ortho_s.jpg（z18）、osm_s.json（tools/prep_osm_s.py）
   地點與出處：專案根目錄 階段5_資料清單.md
   ===================================================================== */
const DATA = 'data/';
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => t * t * (3 - 2 * t);
let CX, CZ, renderer, scene, camera, controls, clock = new THREE.Clock();
let G, OSM, T;                       // T：5 m 地形網格（base＝未挖、cut＝挖過水道）
const labels = [], lineMats = [], waterTex = [], flowLines = [];
const IRR = 0x1d8fe0, DRAIN = 0xe07a1d, OTHER = 0x64748b;

/* ---------- 經緯度 → local（TWD97 TM2，同 tools/prep_dem.py） ---------- */
function ll2tm(lat, lon) {
  const a = 6378137, f = 1 / 298.257222101, e2 = f * (2 - f), k0 = 0.9999, ep2 = e2 / (1 - e2), lon0 = 121 * Math.PI / 180;
  const phi = lat * Math.PI / 180, lam = lon * Math.PI / 180;
  const M = a * ((1 - e2 / 4 - 3 * e2 ** 2 / 64 - 5 * e2 ** 3 / 256) * phi - (3 * e2 / 8 + 3 * e2 ** 2 / 32 + 45 * e2 ** 3 / 1024) * Math.sin(2 * phi)
    + (15 * e2 ** 2 / 256 + 45 * e2 ** 3 / 1024) * Math.sin(4 * phi) - (35 * e2 ** 3 / 3072) * Math.sin(6 * phi));
  const N = a / Math.sqrt(1 - e2 * Math.sin(phi) ** 2), Tt = Math.tan(phi) ** 2, C = ep2 * Math.cos(phi) ** 2, A = (lam - lon0) * Math.cos(phi);
  const x = 250000 + k0 * N * (A + (1 - Tt + C) * A ** 3 / 6 + (5 - 18 * Tt + Tt * Tt + 72 * C - 58 * ep2) * A ** 5 / 120);
  const y = k0 * (M + N * Math.tan(phi) * (A * A / 2 + (5 - Tt + 9 * C + 4 * C * C) * A ** 4 / 24 + (61 - 58 * Tt + Tt * Tt + 600 * C - 330 * ep2) * A ** 6 / 720));
  return [x, y];
}
const LL = (lat, lon) => { const [x, y] = ll2tm(lat, lon); return [x - G.meta.x0, G.meta.y1 - y]; };

/* ---------- 地點（使用者提供經緯度；學校依正射影像上的校地） ---------- */
const PLACES = {
  temple: [23.9245582, 120.5622434], station: [23.928127, 120.571675],
  yishan: [23.926743, 120.556761], dongning: [23.921791, 120.561343],
  b5: [23.9185115, 120.56024], ruyi: [23.916351, 120.5616055],
  g1: [23.909413, 120.563562], g2: [23.914805, 120.5620779], g3: [23.9202093, 120.5598053],
  dEnd: [23.9234163, 120.5490893], dDrain: [23.9246474, 120.5481894],
};
const P = {};

/* ---------- 地形 ---------- */
function demAt(lx, lz) {                     // 20 m DEM 雙線性
  const { nx, ny, cell } = G.meta;
  const fx = clamp(lx / cell, 0, nx - 1.001), fz = clamp(lz / cell, 0, ny - 1.001), i = Math.floor(fx), j = Math.floor(fz), tx = fx - i, tz = fz - j;
  const h = (a, b) => G.H[b * nx + a];
  return lerp(lerp(h(i, j), h(i + 1, j), tx), lerp(h(i, j + 1), h(i + 1, j + 1), tx), tz);
}
function gridAt(arr, lx, lz) {               // 5 m 網格雙線性
  const fx = clamp(lx / T.c, 0, T.nx - 1.001), fz = clamp(lz / T.c, 0, T.nz - 1.001), i = Math.floor(fx), j = Math.floor(fz), tx = fx - i, tz = fz - j;
  const h = (a, b) => arr[b * T.nx + a];
  return lerp(lerp(h(i, j), h(i + 1, j), tx), lerp(h(i, j + 1), h(i + 1, j + 1), tx), tz);
}
const hB = (lx, lz) => gridAt(T.base, lx, lz);     // 地面（路、房子、樹用）
const hC = (lx, lz) => gridAt(T.cut, lx, lz);      // 挖過水道的地形（漫遊時貼地）
const V = (lx, ly, lz) => new THREE.Vector3(lx - CX, ly, lz - CZ);

function resample(pts, step) {
  const out = [pts[0]];
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i], b = pts[i + 1], L = Math.hypot(b[0] - a[0], b[1] - a[1]), n = Math.max(1, Math.ceil(L / step));
    for (let k = 1; k <= n; k++) out.push([lerp(a[0], b[0], k / n), lerp(a[1], b[1], k / n)]);
  }
  return out;
}
function clipRuns(pts, m = 2) {              // 只留範圍內的部分
  const W = G.W, H = G.Hh, runs = []; let cur = [];
  for (const p of resample(pts, 4)) {
    if (p[0] > m && p[0] < W - m && p[1] > m && p[1] < H - m) cur.push(p);
    else { if (cur.length > 1) runs.push(cur); cur = []; }
  }
  if (cur.length > 1) runs.push(cur);
  return runs;
}

/* =====================================================================
   主程式
   ===================================================================== */
init();
async function init() {
  const [meta, buf, osm, bld] = await Promise.all([
    fetch(DATA + 'meta_s.json').then(r => r.json()), fetch(DATA + 'dem_s.f32').then(r => r.arrayBuffer()), fetch(DATA + 'osm_s.json', { cache: 'no-cache' }).then(r => r.json()), fetch(DATA + 'bld_si.json', { cache: 'no-cache' }).then(r => r.json())]);
  G = { meta, H: new Float32Array(buf), W: meta.x1 - meta.x0, Hh: meta.y1 - meta.y0 }; OSM = osm; BLD = bld; IB = bld.box;
  // 永崙路在學校東南角的彎道：OSM 線穿過路旁房子 → 改用臺灣通用電子地圖的道路中心線（黃線）與路面（2026-11-12）
  // 正射影像在這裡不能用：路旁 3 樓透天的屋頂因拍攝角度倒向路面，蓋住了一部分路；電子地圖是地面的向量圖，房子輪廓與路面互相吻合（路寬約 8 m）
  { const r = OSM.roads.find(r => r.n === '永崙路' && r.pts.some(p => Math.hypot(p[0] - 2171.9, p[1] - 614.9) < 1));
    if (r) { const i0 = r.pts.findIndex(p => Math.hypot(p[0] - 2150.3, p[1] - 632.5) < 1), i1 = r.pts.findIndex(p => Math.hypot(p[0] - 2185.9, p[1] - 555.2) < 1);
      if (i0 >= 0 && i1 > i0) r.pts.splice(i0, i1 - i0, [2150.3, 633.9], [2153, 628], [2157.2, 624], [2160, 622], [2162, 620], [2164.2, 618], [2166.2, 616], [2168, 614], [2173, 610], [2178.3, 604], [2180.2, 600], [2182.5, 596], [2183.5, 580]);
      r.w = 5; } }
  // 永興路二段與永崙路的路口：路口點往南移 1.4 m，讓 8 m 路面的北緣落在影像上的校門東側路緣（z≈629.8–630.5，北側是學校矮牆、沒有高物遮擋）
  for (const r of OSM.roads) if (r.n === '永興路二段') for (const q of r.pts) if (Math.hypot(q[0] - 2150.3, q[1] - 632.5) < 0.5) q[1] = 633.9;
  // 縱貫線、月台、平交道：OSM 比臺灣通用電子地圖的鐵路中心線偏東 4–8 m（每 20 m 比對一次，z19 影像的月台位置也一致）→ 依 z 內插往西移；內圈外 60 m 漸變為 0
  { const T = [[0, -6], [40, -8], [340, -8], [380, -6.2], [440, -5.6], [480, -4.4], [540, -4.4], [660, -4.8], [740, -5.4], [840, -6.2], [980, -6.4], [1040, -7], [1200, -7.4], [1368, -7.4]];
    const dx = z => { const zc = clamp(z, 0, 1368); let v = T[T.length - 1][1]; for (let i = 0; i < T.length - 1; i++) if (zc >= T[i][0] && zc <= T[i + 1][0]) { v = lerp(T[i][1], T[i + 1][1], (zc - T[i][0]) / (T[i + 1][0] - T[i][0])); break; }
      const out = z < 0 ? -z : z > 1368 ? z - 1368 : 0; return v * clamp(1 - out / 60, 0, 1); };
    for (const r of OSM.rail) for (const q of r) q[0] += dx(q[1]);
    for (const pl of OSM.plat) for (const q of pl.pts) q[0] += dx(q[1]);
    for (const q of OSM.xing) q[0] += dx(q[1]);
    // OSM 的兩條 way 各是一軌（相距 4–6 m）；上面的位移是拿西軌比電子地圖中心線 → 兩軌再各往西移半個軌距，讓兩軌中間＝電子地圖中心線（z19 影像上兩軌正好落在兩座月台之間）
    if (OSM.rail.length === 2) {

  CX = G.W / 2; CZ = G.Hh / 2;

  P.templeFoot = [tLoc(-8, -14), tLoc(8, -14), tLoc(8, 13), tLoc(-8, 13)];

/* ---------- 水道資料：OSM 線 → 範圍內的段落（含示意寬深、流向） ---------- */
let CH = [];
function prepWater() {
  const DEPTH = { '八堡二圳東溝': 1.8, '陳厝厝排水支線': 2.6 };      // 示意（沒有官方斷面資料）
  for (const w of OSM.water) {
    if (w.ug) continue;
    for (let run of clipRuns(w.pts)) {
      // 流向：高的一端是上游（東溝、陳厝厝的 OSM 方向本來就是上游→下游，這裡再用地形確認）
      if (!w.n && demAt(...run[0]) < demAt(...run[run.length - 1]) - 0.3) run = run.reverse();
      const s = [0]; for (let i = 1; i < run.length; i++) s.push(s[i - 1] + Math.hypot(run[i][0] - run[i - 1][0], run[i][1] - run[i - 1][1]));
      CH.push({ n: w.n, k: w.k, w: w.w, d: DEPTH[w.n] ?? 1.0, pts: run, s });
    }
  }
  // 東溝在永靖鄉公所旁改名（依 Google 地圖名稱）：記下這段的里程
  for (const c of CH) {
    if (c.n !== '八堡二圳東溝') continue;
    const near = p => { let b = 1e9, bs = 0; c.pts.forEach((q, i) => { const d = Math.hypot(q[0] - p[0], q[1] - p[1]); if (d < b) { b = d; bs = c.s[i]; } }); return [b, bs]; };
    const [d1, s1] = near(P.dEnd), [d2, s2] = near(P.dDrain);
    if (d1 < 30 && d2 < 30) c.rename = [Math.min(s1, s2), Math.max(s1, s2)];
  }
  // 改名處以下（下游）的東溝段落都算排水路：從有改名的那段尾端往下接
  let tail = CH.find(c => c.rename);
  for (let guard = 0; tail && guard < 10; guard++) {
    const end = tail.pts[tail.pts.length - 1];
    const nxt = CH.find(c => c.n === '八堡二圳東溝' && !c.rename && !c.after && Math.hypot(c.pts[0][0] - end[0], c.pts[0][1] - end[1]) < 12);
    if (nxt) nxt.after = true; tail = nxt;
  }
  // 沿線地面高（平滑，避免 20 m 網格造成的階梯）
  for (const c of CH) {
    const raw = c.pts.map(p => demAt(p[0], p[1])), n = raw.length;
    c.g = raw.map((_, i) => { let a = 0, k = 0; for (let j = Math.max(0, i - 8); j <= Math.min(n - 1, i + 8); j++) { a += raw[j]; k++; } return a / k; });
  }
}
function chColor(c, s) {                         // 這一點的顏色（灌溉藍／排水橘／改名段漸變）
  if (c.k === 'drain' || c.after) return new THREE.Color(DRAIN);
  if (c.k !== 'irr') return new THREE.Color(OTHER);
  if (!c.rename) return new THREE.Color(IRR);
  const t = clamp((s - c.rename[0]) / (c.rename[1] - c.rename[0]), 0, 1);
  return new THREE.Color(IRR).lerp(new THREE.Color(DRAIN), t);
}

/* ---------- 5 m 地形網格：base 平滑內插；cut 在水道處往下挖 ---------- */
function buildGrid() {
  const c = 5, nx = Math.floor(G.W / c) + 1, nz = Math.floor(G.Hh / c) + 1;
  const base = new Float32Array(nx * nz);
  for (let j = 0; j < nz; j++) for (let i = 0; i < nx; i++) base[j * nx + i] = demAt(i * c, j * c);
  const cut = base.slice();
  T = { c, nx, nz, base, cut };
  for (const ch of CH) {
    const hw = ch.w / 2;
    for (let k = 0; k < ch.pts.length - 1; k++) {
      const [ax, az] = ch.pts[k], [bx, bz] = ch.pts[k + 1], dx = bx - ax, dz = bz - az, L2 = dx * dx + dz * dz || 1;
      const g = (ch.g[k] + ch.g[k + 1]) / 2, R = hw + 4;
      for (let j = Math.max(0, Math.floor((Math.min(az, bz) - R) / c)); j <= Math.min(nz - 1, Math.ceil((Math.max(az, bz) + R) / c)); j++)
        for (let i = Math.max(0, Math.floor((Math.min(ax, bx) - R) / c)); i <= Math.min(nx - 1, Math.ceil((Math.max(ax, bx) + R) / c)); i++) {
          const x = i * c, z = j * c, t = clamp(((x - ax) * dx + (z - az) * dz) / L2, 0, 1), d = Math.hypot(ax + t * dx - x, az + t * dz - z), id = j * nx + i;
          if (d < hw + 4) { cut[id] = Math.min(cut[id], g); base[id] = Math.min(base[id], g + 0.02); }   // 岸邊：和牆頂齊平（水道本身用遮罩在地形上挖洞）
        }

}
async function buildTerrain() {
  const { c, nx, nz } = T, pos = new Float32Array(nx * nz * 3), uv = new Float32Array(nx * nz * 2);
  for (let j = 0; j < nz; j++) for (let i = 0; i < nx; i++) {

    uv[k * 2] = i * c / G.W; uv[k * 2 + 1] = 1 - j * c / G.Hh;
  }
  const idx = new Uint32Array((nx - 1) * (nz - 1) * 6); let p = 0;
  for (let j = 0; j < nz - 1; j++) for (let i = 0; i < nx - 1; i++) { const a = j * nx + i, b = a + 1, d = a + nx, e = d + 1; idx[p++] = a; idx[p++] = d; idx[p++] = b; idx[p++] = b; idx[p++] = d; idx[p++] = e; }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3)); geo.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  geo.setIndex(new THREE.BufferAttribute(idx, 1)); geo.computeVertexNormals();
  const tex = await new Promise(res => new THREE.TextureLoader().load(DATA + 'ortho_s.jpg', t => { t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 16; res(t); }));
  // 水道遮罩：1 公尺一像素，水道的範圍在地形上挖空，露出底下的牆、溝底與水面
  const cv = document.createElement('canvas'); cv.width = Math.round(G.W); cv.height = Math.round(G.Hh);
  const x = cv.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, cv.width, cv.height);
  x.strokeStyle = '#000'; x.lineCap = 'round'; x.lineJoin = 'round';
  for (const c of CH) { x.lineWidth = c.w - 0.2; x.beginPath(); c.pts.forEach((p, i) => i ? x.lineTo(p[0], p[1]) : x.moveTo(p[0], p[1])); x.stroke(); }
  MASKCV = cv; const mask = new THREE.CanvasTexture(cv); mask.flipY = true;
  scene.add(new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ map: tex, alphaMap: mask, alphaTest: 0.5, roughness: 0.97 })));

/* ---------- 帶狀網格（沿折線，左右寬度、每點高度） ---------- */
function ribbon(pts, wl, wr, hFn, uScale = 0) {
  const n = pts.length, pos = new Float32Array(n * 6), uv = new Float32Array(n * 4), idx = [];
  let s = 0;
  for (let i = 0; i < n; i++) {
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(n - 1, i + 1)];
    let tx = b[0] - a[0], tz = b[1] - a[1]; const L = Math.hypot(tx, tz) || 1; tx /= L; tz /= L;
    const nx = -tz, nz = tx;                    // 左手邊法向
    if (i) s += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
    const [hl, hr] = hFn(i, pts[i]);
    pos.set([pts[i][0] + nx * wl - CX, hl, pts[i][1] + nz * wl - CZ, pts[i][0] - nx * wr - CX, hr, pts[i][1] - nz * wr - CZ], i * 6);
    uv.set([uScale ? s / uScale : 0, 0, uScale ? s / uScale : 0, 1], i * 4);
    if (i < n - 1) idx.push(i * 2, i * 2 + 2, i * 2 + 1, i * 2 + 1, i * 2 + 2, i * 2 + 3);   // 面朝上
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); g.setAttribute('uv', new THREE.BufferAttribute(uv, 2)); g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

/* ---------- 水道：混凝土牆＋溝底＋流動的水面＋上空的彩色線 ---------- */
function rippleTexture() {
  const cv = document.createElement('canvas'); cv.width = 128; cv.height = 64; const x = cv.getContext('2d');
  x.fillStyle = '#fff'; x.fillRect(0, 0, 128, 64);
  x.strokeStyle = 'rgba(0,0,0,.18)'; x.lineWidth = 3;
  for (let k = 0; k < 3; k++) { x.beginPath(); x.moveTo(20 + k * 40, 6); x.lineTo(40 + k * 40, 32); x.lineTo(20 + k * 40, 58); x.stroke(); }   // 「>」形，順流方向
  const t = new THREE.CanvasTexture(cv); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace;

}
function buildWater() {
  const wallM = new THREE.MeshStandardMaterial({ color: 0x9c9a92, roughness: 0.95, side: THREE.DoubleSide });
  const bedM = new THREE.MeshStandardMaterial({ color: 0x6b6150, roughness: 1 });
  const rip = rippleTexture();
  const wIrr = new THREE.MeshStandardMaterial({ color: 0x6f6a5a, roughness: 0.6, metalness: 0, envMapIntensity: 0.4, map: rip });   // 濁水溪的水，偏灰
  const wDr = new THREE.MeshStandardMaterial({ color: 0x46503f, roughness: 0.6, metalness: 0, envMapIntensity: 0.4, map: rip.clone() });
  waterTex.push(wIrr.map, wDr.map);
  for (const c of CH) {
    const hw = c.w / 2, top = i => c.g[i] + 0.25, bot = i => c.g[i] - c.d;
    const left = c.pts.map((p, i) => p), wl = ribbon(c.pts, hw, -hw + 0.001, i => [top(i), bot(i)]);   // 左牆（由頂到底）
    scene.add(new THREE.Mesh(wl, wallM));
    scene.add(new THREE.Mesh(ribbon(c.pts, -hw + 0.001, hw, i => [bot(i), top(i)]), wallM));               // 右牆
    scene.add(new THREE.Mesh(ribbon(c.pts, hw + 0.3, -hw + 0.001, i => [top(i), top(i)]), wallM));         // 左牆頂
    scene.add(new THREE.Mesh(ribbon(c.pts, -hw + 0.001, hw + 0.3, i => [top(i), top(i)]), wallM));         // 右牆頂
    scene.add(new THREE.Mesh(ribbon(c.pts, hw, hw, i => [bot(i), bot(i)]), bedM));
    const wm = c.k === 'drain' ? wDr : wIrr;
    const water = new THREE.Mesh(ribbon(c.pts, hw - 0.05, hw - 0.05, i => [bot(i) + 0.55, bot(i) + 0.55], 6), wm);
    scene.add(water);
    // 上空的彩色流向線（從高處看才明顯）
    const pos = [], col = [];
    c.pts.forEach((p, i) => { pos.push(p[0] - CX, c.g[i] + 1.2, p[1] - CZ); const k = chColor(c, c.s[i]); col.push(k.r, k.g, k.b); });

    m.resolution.set(innerWidth, innerHeight); lineMats.push(m);
    const ln = new Line2(g, m); ln.computeLineDistances(); ln.renderOrder = 2; scene.add(ln);

}

/* ---------- 道路（貼地帶狀；橋另外處理） ---------- */
function buildRoads() {
  const mainM = std(0xffffff, { map: texRoadMain(), roughness: 0.9 }), plainM = std(0xffffff, { map: texRoadPlain(), roughness: 0.92 });
  const gm = [], gp = [];
  for (const r of OSM.roads) {
    if (r.n === '高鐵星光大橋') continue;
    const isMain = ['tertiary', 'secondary', 'primary'].includes(r.c);
    for (const run of clipRuns(r.pts, 0)) {
      const pts = resample(run, 5), hw = r.w / 2;
      const rg = ribbon(pts, hw, hw, (i, p) => { const h = hB(p[0], p[1]) + 0.12; return [h, h]; }, isMain ? 8 : 6);
      (isMain ? gm : gp).push(rg);
    }
  }
  scene.add(new THREE.Mesh(mergeGeometries(gm), mainM), new THREE.Mesh(mergeGeometries(gp), plainM));
  // 永興國小前的紅磚人行道（依街景）
  const yx = OSM.roads.find(r => r.n === '永興路二段');
  if (yx) { const pts = resample(yx.pts, 3).filter(p => p[0] > 2008 && p[0] < 2150), hw = yx.w / 2;
    if (pts.length > 1) scene.add(new THREE.Mesh(ribbon(pts, -hw, hw + 2.6, (i, p) => { const h = hB(p[0], p[1]) + 0.25; return [h, h]; }, 2), std(0xffffff, { map: texBrick() }))); }
  // 道路跨水道處：小橋（橋面＋矮護欄，示意）
  const parM = new THREE.MeshStandardMaterial({ color: 0xd9d6cc, roughness: 0.9 });
  const bx = [];
  for (const r of OSM.roads) {
    if (r.n === '高鐵星光大橋' || r.c === 'track') continue;
    for (const c of CH) {
      if (!c.n && c.w < 4) continue;
      for (let i = 0; i < r.pts.length - 1; i++) for (let k = 0; k < c.pts.length - 1; k += 1) {
        const X = segX(r.pts[i], r.pts[i + 1], c.pts[k], c.pts[k + 1]); if (!X) continue;
        const ang = Math.atan2(r.pts[i + 1][1] - r.pts[i][1], r.pts[i + 1][0] - r.pts[i][0]);
        const L = c.w + 3, h = c.g[k] + 0.3;
        for (const side of [-1, 1]) {
          const ox = -Math.sin(ang) * side * (r.w / 2 + 0.15), oz = Math.cos(ang) * side * (r.w / 2 + 0.15);
          const m = new THREE.Mesh(new THREE.BoxGeometry(L, 0.75, 0.3), parM);
          m.position.copy(V(X[0] + ox, h + 0.37, X[1] + oz)); m.rotation.y = -ang; scene.add(m);

}

  const r1 = b[0] - a[0], r2 = b[1] - a[1], s1 = d[0] - c[0], s2 = d[1] - c[1], den = r1 * s2 - r2 * s1;

  const t = ((c[0] - a[0]) * s2 - (c[1] - a[1]) * s1) / den, u = ((c[0] - a[0]) * r2 - (c[1] - a[1]) * r1) / den;
  return t >= 0 && t <= 1 && u >= 0 && u <= 1 ? [a[0] + t * r1, a[1] + t * r2] : null;

/* ---------- 鐵路、永靖車站（月台位置依 OSM，雨棚、天橋為示意） ---------- */
let RAILH;
function buildRail() {

}

  const crown = new THREE.InstancedMesh(crownG, new THREE.MeshStandardMaterial({ color: 0x3f6b2e, roughness: 0.95, flatShading: true }), n);
  const trunk = new THREE.InstancedMesh(trunkG, new THREE.MeshStandardMaterial({ color: 0x5b4632, roughness: 1 }), n);
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), c = new THREE.Color();
  tr.forEach(([x, z, s], i) => {
    const g = hB(x, z), th = 2.4 * s, cr = 3.0 * s;
    m4.compose(V(x, g, z), q, new THREE.Vector3(s, th, s)); trunk.setMatrixAt(i, m4);

}

          <p>浮圳村這一段的圳路，地面比兩旁的田高（地形資料量到約 1.3 公尺）。</p>
          <p class="note">※ 溝的寬度、深度沒有官方資料，畫面是示意。</p>${src('a2', 'osm', 'dem')}` };
    case 'chen': return { t: '陳厝厝排水支線', s: '排水路｜彰化縣管區域排水',
      b: `<p>大致由東南往西北流，是<strong>員林大排水幹線</strong>的支線，流經田中、社頭、永靖、埔心。</p>
          <p>東寧橋一帶的樣子（剖面）：兩邊是直立的混凝土牆，水面比路面低不少。</p>${sectionSVG({ w: 7, water: 2, color: '#5d6a58' })}
          <p>它的分線有五汴頭排水分線、<strong>永興排水分線</strong>、湳底二中排支線。</p>
          <p class="note">※ 溝的寬度、深度沒有官方資料，畫面是示意。</p>${src('a1', 'osm')}` };
    case 'smalld': return { t: '其他排水路', s: '縣管區域排水的分線',
      b: `<p>永興排水分線是陳厝厝排水支線的分線；湳港西排水分線是東溝排水支線的分線。</p>${src('a1', 'osm')}` };
    case 'rename': return { t: '同一條溝，換了名字', s: '永靖鄉公所旁',
      b: `<p>這是同一條連續的溝。地圖上，上游叫<strong style="color:var(--irr)">八堡二圳東溝</strong>（灌溉圳），到了永靖鄉公所旁，下游改叫<strong style="color:var(--drain)">東溝排水</strong>（排水路）。</p>
          <p>東溝排水支線是員林大排水幹線的支線，最後流進台灣海峽。</p>
          <p class="note">※ 改名的位置依 Google 地圖名稱；畫面上這一段的顏色由藍漸漸變橘。</p>${src('gm', 'a1')}` };
  }
}
/* 「水從哪裡來、到哪裡去」導覽 */
const GUIDE = [
  { v: 'dong', hl: ['八堡二圳東溝'], t: '1. 水從哪裡來？', s: '八堡二圳東溝（灌溉圳）',
    b: `<p>這條藍色的是<strong style="color:var(--irr)">八堡二圳東溝</strong>。水從二水引進濁水溪，經過田中的東西溝分水門，<strong>由南往北</strong>流到永靖。</p>
        <p>水面上的「＞」記號指出水流的方向。</p>${src('a2', 'osm')}` },
  { v: 'fieldReal', hl: ['八堡二圳東溝', '陳厝厝排水支線'], t: '2. 送進田裡', s: '灌溉圳 → 田 → 排水路（示意）',
    b: `<p>灌溉圳的水經過小水路<strong>送進田裡</strong>；田裡多出來的水和下雨的水，再經過小水路<strong>排到排水路</strong>。</p>
        <p>永靖工作站也會把灌溉後的餘水再利用（制水迴歸）。</p>
        <p class="note">※ 地圖上的箭頭只表示方向；田間的小水路太小，這張地圖沒有畫。</p>
        <p><button onclick="enterField()" style="padding:9px 16px;border-radius:12px;background:#16a34a;color:#fff;font-weight:900;font-size:15.5px">走到這塊田看看：水怎麼進出 ▶</button></p>${src('a2')}` },
  { v: 'chen', hl: ['陳厝厝排水支線'], t: '3. 用過的水去哪裡？', s: '陳厝厝排水支線（排水路）',
    b: `<p>橘色的是<strong style="color:var(--drain)">陳厝厝排水支線</strong>，在學校西南邊斜斜經過，大致<strong>由東南往西北</strong>流。</p>
        <p>灌溉圳把水<strong>送來</strong>，排水路把水<strong>帶走</strong>，兩種水路的工作不一樣，管理的單位也不一樣。</p>${src('a1', 'a2')}` },
  { v: 'rename', hl: ['八堡二圳東溝'], t: '4. 同一條溝，換了名字', s: '永靖鄉公所旁',
    b: `<p>東溝往北流到永靖鄉公所旁，地圖上的名字從<strong style="color:var(--irr)">八堡二圳東溝</strong>變成<strong style="color:var(--drain)">東溝排水</strong>。</p>${src('gm')}` },
  { v: 'overview', hl: ['八堡二圳東溝', '陳厝厝排水支線'], t: '5. 最後流到海', s: '員林大排水幹線 → 台灣海峽',
    b: `<p>東溝排水支線、陳厝厝排水支線都是<strong>員林大排水幹線</strong>的支線，水往北匯進員林大排，最後流進<strong>台灣海峽</strong>。</p>
        <p><a href="region.html?view=yong" style="color:#0369a1;font-weight:900">到區域鳥瞰看整條路 →</a></p>${src('a1')}` },
];
let gi = -1;
function openPanel(key) {
  gi = -1; setHL(null);
  const d = INFO(key); if (!d) return;
  showPanel('', d.t, d.s, d.b, false);
}
function showPanel(step, t, s, b, guide) {
  const p = document.getElementById('panel');
  document.getElementById('pStep').textContent = step; document.getElementById('pTitle').textContent = t;
  document.getElementById('pSub').textContent = s; document.getElementById('pBody').innerHTML = b;
  p.classList.toggle('guide', guide); p.classList.add('open'); p.scrollTop = 0;
}
function goGuide(i) {
  gi = clamp(i, 0, GUIDE.length - 1); const g = GUIDE[gi];
  showPanel(`導覽 ${gi + 1} / ${GUIDE.length}`, g.t, g.s, g.b, true);
  document.getElementById('bNext').textContent = gi === GUIDE.length - 1 ? '結束' : '下一步 ▶';
  document.getElementById('bPrev').style.visibility = gi ? 'visible' : 'hidden';
  setHL(g.hl); fieldArrows.visible = g.v === 'field'; flyTo(g.v);
}
function setHL(names) {
  for (const f of flowLines) {
    const on = !names || names.includes(f.c.n);
    f.m.opacity = on ? (f.named ? 0.95 : 0.7) : 0.15; f.m.linewidth = names && on && f.named ? 9 : f.named ? 6 : 3;
  }
  if (!names) fieldArrows.visible = false;
}

/* 導覽第 2 步：圳 → 田 → 排水路的方向箭頭（示意） */
let fieldArrows;
function buildFieldArrows() {
  fieldArrows = new THREE.Group(); fieldArrows.visible = false; scene.add(fieldArrows);
  // 在閘門 3 北邊，東溝和陳厝厝排水之間找一塊地（兩條水路此處相距約 230 m）
  const cd = CH.filter(c => c.n === '八堡二圳東溝'), cc = CH.filter(c => c.n === '陳厝厝排水支線');
  const nearest = (list, p) => { let b = 1e9, q = null; for (const c of list) for (const r of c.pts) { const d = Math.hypot(r[0] - p[0], r[1] - p[1]); if (d < b) { b = d; q = r; } } return q; };
  // 沿東溝找：和陳厝厝排水相距 150–450 m、中間房子最少的地方（真的是田）
  let best = null;
  for (const c of cd) for (let i = 0; i < c.pts.length; i += 10) {
    const a = c.pts[i], b = nearest(cc, a), D = Math.hypot(a[0] - b[0], a[1] - b[1]); if (D < 150 || D > 450) continue;
    const m = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
    const cnt = OSM.houses.reduce((s, h) => s + (Math.hypot(h[0] - m[0], h[1] - m[1]) < 50 ? 1 : 0), 0);
    if (!best || cnt < best.cnt) best = { a, b, m, cnt };
  }
  const { a, b, m } = best;
  P.field = m;
  const mk = (p0, p1, color) => {
    const dir = new THREE.Vector3(p1[0] - p0[0], 0, p1[1] - p0[1]); const L = dir.length(); dir.normalize();
    const ar = new THREE.ArrowHelper(dir, V(p0[0], hB(...p0) + 14, p0[1]), L, color, 34, 22);
    ar.line.material.linewidth = 3; fieldArrows.add(ar); return ar;
  };
  mk(a, m, IRR); mk(m, b, DRAIN);
  const plot = new THREE.Mesh(new THREE.CircleGeometry(28, 32), new THREE.MeshBasicMaterial({ color: 0x84cc16, transparent: true, opacity: 0.35, depthWrite: false }));
  plot.rotation.x = -Math.PI / 2; plot.position.copy(V(m[0], hB(...m) + 0.6, m[1])); fieldArrows.add(plot);
  addLabel('田（示意）', 'geo sm', m[0], m[1], 8, 2000);
}

/* =====================================================================
   視角、漫遊
   ===================================================================== */
function viewDef(v) {
  const at = (k, dx, dy, dz) => { const p = Array.isArray(k) ? k : P[k], t = V(p[0], hB(p[0], p[1]), p[1]); return { t, p: t.clone().add(new THREE.Vector3(dx, dy, dz)) }; };
  switch (v) {
    case 'overview': return at([G.W * 0.52, G.Hh * 0.5], -300, 1500, 1500);
    case 'school': return at([2080, 598], -55, 38, 95);
    case 'temple': return at([P.templeM[0], P.templeM[1] + 2], -18, 20, 50);
    case 'station': return at('station', -150, 70, 60);
    case 'chen': return at('dongning', 70, 60, 110);
    case 'dong': return at('ruyi', 160, 120, 140);
    case 'rename': return at('rename', 150, 140, 160);
    case 'field': return at('field', 200, 260, 330);
    case 'fieldReal': return at([1636, 1100], -34, 24, 40);
    case 'fieldOut': return at([1641, 1081], -14, 9, 16);
    case 'fieldTop': return at([1645, 1100], 0, 110, 2);
    case 'fieldHead': return at(FIELD.feed[0], -12, 8, 14);
  }
}
const walk = { on: false, yaw: 0, pitch: 0, vx: 0, vz: 0, keys: {}, run: false };
function flyTo(v, dur = 1.8) {
  document.querySelectorAll('.vw').forEach(b => b.classList.toggle('active', b.dataset.v === v));
  if (v === 'walk') return startWalk();
  stopWalk();
  const d = viewDef(v); if (!d) return;
  if (!dur) { camera.position.copy(d.p); controls.target.copy(d.t); controls.update(); return; }
  gsap.to(camera.position, { x: d.p.x, y: d.p.y, z: d.p.z, duration: dur, ease: 'power2.inOut' });
  gsap.to(controls.target, { x: d.t.x, y: d.t.y, z: d.t.z, duration: dur, ease: 'power2.inOut', onUpdate: () => controls.update() });
}
function startWalk(k) {
  walk.on = true; controls.enabled = false;
  const sp = SPOTS.find(o => o.k === (k || document.getElementById('spot').value)) || SPOTS[0];
  document.getElementById('spot').value = sp.k;
  const [x, z] = sp.snap === false ? sp.p : snapRoad(sp.p);                                  // 站在最近道路的中線上
  camera.position.copy(V(x, Math.max(hC(x, z), hB(x, z)) + (sp.eye || 1.35), z));
  walk.yaw = Math.atan2(-(sp.look[0] - x), -(sp.look[1] - z)); walk.pitch = sp.pitch ?? -0.02; walk.eye = sp.eye || 1.35;
  camera.rotation.set(walk.pitch, walk.yaw, 0, 'YXZ');
  document.getElementById('walkHud').classList.add('on');
}
function snapRoad(p) {
  let best = 1e9, q = p;
  for (const r of OSM.roads) for (let i = 0; i < r.pts.length - 1; i++) {
    const [ax, az] = r.pts[i], [bx, bz] = r.pts[i + 1], dx = bx - ax, dz = bz - az, t = clamp(((p[0] - ax) * dx + (p[1] - az) * dz) / (dx * dx + dz * dz || 1), 0, 1);
    const x = ax + t * dx, z = az + t * dz, d = Math.hypot(x - p[0], z - p[1]); if (d < best) { best = d; q = [x, z]; }
  }
  return best < 25 ? q : p;
}
function stopWalk() {
  if (!walk.on) return; walk.on = false; controls.enabled = true;
  document.getElementById('walkHud').classList.remove('on');
}
function updateWalk(dt) {
  const k = walk.keys, f = (k.KeyW || k.ArrowUp ? 1 : 0) - (k.KeyS || k.ArrowDown ? 1 : 0) + walk.vz;
  const s = (k.KeyD || k.ArrowRight ? 1 : 0) - (k.KeyA || k.ArrowLeft ? 1 : 0) + walk.vx;
  const sp = 4.2 * dt * (k.ShiftLeft || walk.run ? 4 : 1);
  const fx = -Math.sin(walk.yaw), fz = -Math.cos(walk.yaw);
  const p = camera.position;
  p.x = clamp(p.x + (fx * f - fz * s) * sp, -CX + 5, CX - 5); p.z = clamp(p.z + (fz * f + fx * s) * sp, -CZ + 5, CZ - 5);
  const lx = p.x + CX, lz = p.z + CZ;
  const g = Math.max(hC(lx, lz), hB(lx, lz) - 0.05) + (walk.eye || 1.35);       // 走在路面上（過水道時走橋面）
  p.y = lerp(p.y, g, 0.25);
  camera.rotation.set(walk.pitch, walk.yaw, 0, 'YXZ');
}

function setupUI() {
  buildFieldArrows();
  document.querySelectorAll('.vw').forEach(b => b.addEventListener('click', () => { gi = -1; setHL(null); flyTo(b.dataset.v); }));
  document.querySelector('#panel .x').addEventListener('click', () => { document.getElementById('panel').classList.remove('open'); gi = -1; setHL(null); });
  document.getElementById('bGuide').addEventListener('click', () => goGuide(0));
  document.getElementById('bField').addEventListener('click', enterField);
  window.enterField = enterField;
  document.getElementById('bNext').addEventListener('click', () => { if (gi >= GUIDE.length - 1) { document.getElementById('panel').classList.remove('open'); gi = -1; setHL(null); } else goGuide(gi + 1); });
  document.getElementById('bPrev').addEventListener('click', () => goGuide(gi - 1));
  document.getElementById('exitWalk').addEventListener('click', () => flyTo('school'));
  const sel = document.getElementById('spot'); sel.innerHTML = SPOTS.map(o => `<option value="${o.k}">${o.t}</option>`).join('');
  sel.addEventListener('change', () => startWalk(sel.value)); sel.addEventListener('pointerdown', e => e.stopPropagation());
  document.getElementById('bRun').addEventListener('click', e => { walk.run = !walk.run; e.target.classList.toggle('on', walk.run); });
  addEventListener('keydown', e => walk.keys[e.code] = true);
  addEventListener('keyup', e => walk.keys[e.code] = false);
  let drag = null;
  renderer.domElement.addEventListener('pointerdown', e => { if (walk.on) drag = { x: e.clientX, y: e.clientY, id: e.pointerId }; });
  addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.id) return;
    walk.yaw -= (e.clientX - drag.x) * 0.004; walk.pitch = clamp(walk.pitch - (e.clientY - drag.y) * 0.004, -1.2, 1.2);
    drag.x = e.clientX; drag.y = e.clientY;
  });
  addEventListener('pointerup', e => { if (drag && e.pointerId === drag.id) drag = null; });
  const joy = document.getElementById('joy'), knob = joy.firstElementChild; let jid = null;
  const jmove = e => {
    const r = joy.getBoundingClientRect(), dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    const m = Math.min(1, Math.hypot(dx, dy) / 50), a = Math.atan2(dy, dx);
    walk.vx = Math.cos(a) * m; walk.vz = -Math.sin(a) * m;
    knob.style.transform = `translate(${Math.cos(a) * m * 40}px,${Math.sin(a) * m * 40}px)`;
  };
  joy.addEventListener('pointerdown', e => { jid = e.pointerId; joy.setPointerCapture(jid); jmove(e); e.stopPropagation(); });
  joy.addEventListener('pointermove', e => { if (e.pointerId === jid) jmove(e); });
  joy.addEventListener('pointerup', () => { jid = null; walk.vx = walk.vz = 0; knob.style.transform = ''; });
}

/* ---------- 每幀 ---------- */
function frame(fixed) {
  const dt = typeof fixed === 'number' ? fixed : Math.min(clock.getDelta(), 0.05);
  for (const t of waterTex) t.offset.x -= dt * 0.25;
  stepField(dt);          // 水面「＞」記號順流而下
  if (walk.on) updateWalk(dt); else controls.update();
  const alt = walk.on ? 0 : camera.position.y - controls.target.y;
  for (const f of flowLines) f.ln.visible = walk.on ? false : alt > 180;   // 近看時藏起上空的彩色線，看真的水面
  updateLabels();
  renderer.render(scene, camera);
}
