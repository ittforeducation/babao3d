<style>
:root{

}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#b9cfe0;font-family:var(--font);color:var(--ink);-webkit-tap-highlight-color:transparent}

button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(170%);backdrop-filter:blur(18px) saturate(170%);border:1px solid var(--stroke);box-shadow:var(--shadow);border-radius:var(--radius)}

#titleCard{position:absolute;top:14px;left:14px;padding:10px 18px 10px 12px;display:flex;gap:12px;align-items:center;z-index:5}

#titleCard h1{margin:0;font-size:21px;font-weight:900;letter-spacing:.04em;line-height:1.2}

#ctrl{position:absolute;top:14px;left:50%;transform:translateX(-50%);display:flex;gap:6px;padding:6px;z-index:5}

.pin::after{content:"";position:absolute;left:50%;bottom:-7px;width:2px;height:7px;background:rgba(255,255,255,.9);transform:translateX(-50%)}

.geo.irr{background:rgba(29,143,224,.78)} .geo.drain{background:rgba(224,122,29,.85)} .geo.water{background:rgba(3,105,161,.62)} .geo.town{background:rgba(13,34,56,.62);font-size:15px}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';
import { Line2 } from 'three/addons/lines/Line2.js';
import { LineMaterial } from 'three/addons/lines/LineMaterial.js';
import { LineGeometry } from 'three/addons/lines/LineGeometry.js';

/* =====================================================================
   座標：1 單位 = 1 公尺；local x 向東、z 向南（自 meta_r 西北角），
   world = local − (CX, CZ)；y = 高程 × EX（地勢放大倍數）
   資料：data/dem_r.f32＋meta_r.json（40 m）、ortho_r.jpg（z15）、osm_r.json（tools/prep_osm_r.py）
   ===================================================================== */
const DATA = 'data/';
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
let CX = 8200, CZ = 11120, EX = 1;
let renderer, scene, camera, controls, clock = new THREE.Clock();
let G, OSM, H0, terrain, ROUTE, lineObjs = [], dropMesh, dropGlow, berm;
const labels = [], lineMats = [];
const IRR = 0x1d8fe0, IRR1 = 0x38bdf8, DRAIN = 0xe07a1d;

/* ---------- 經緯度 → local（TWD97 TM2，同 tools/prep_dem.py） ---------- */
function ll2tm(lat, lon) {
  const a = 6378137, f = 1 / 298.257222101, e2 = f * (2 - f), k0 = 0.9999, ep2 = e2 / (1 - e2), lon0 = 121 * Math.PI / 180;
  const phi = lat * Math.PI / 180, lam = lon * Math.PI / 180;
  const M = a * ((1 - e2 / 4 - 3 * e2 ** 2 / 64 - 5 * e2 ** 3 / 256) * phi - (3 * e2 / 8 + 3 * e2 ** 2 / 32 + 45 * e2 ** 3 / 1024) * Math.sin(2 * phi)
    + (15 * e2 ** 2 / 256 + 45 * e2 ** 3 / 1024) * Math.sin(4 * phi) - (35 * e2 ** 3 / 3072) * Math.sin(6 * phi));
  const N = a / Math.sqrt(1 - e2 * Math.sin(phi) ** 2), T = Math.tan(phi) ** 2, C = ep2 * Math.cos(phi) ** 2, A = (lam - lon0) * Math.cos(phi);
  const x = 250000 + k0 * N * (A + (1 - T + C) * A ** 3 / 6 + (5 - 18 * T + T * T + 72 * C - 58 * ep2) * A ** 5 / 120);
  const y = k0 * (M + N * Math.tan(phi) * (A * A / 2 + (5 - T + 9 * C + 4 * C * C) * A ** 4 / 24 + (61 - 58 * T + T * T + 600 * C - 330 * ep2) * A ** 6 / 720));
  return [x, y];
}
const LL = (lat, lon) => { const [x, y] = ll2tm(lat, lon); return [x - G.meta.x0, G.meta.y1 - y]; };

/* ---------- 地形取樣（雙線性，和網格一致） ---------- */
function hAt(lx, lz) {
  const { nx, ny, cell } = G.meta;
  const fx = clamp(lx / cell, 0, nx - 1.001), fz = clamp(lz / cell, 0, ny - 1.001), i = Math.floor(fx), j = Math.floor(fz), tx = fx - i, tz = fz - j;
  const h = (a, b) => G.H[b * nx + a];
  return lerp(lerp(h(i, j), h(i + 1, j), tx), lerp(h(i, j + 1), h(i + 1, j + 1), tx), tz);
}
/* 線段附近取較高點，避免被 40 m 網格的三角面蓋住 */
const hLine = (lx, lz) => Math.max(hAt(lx, lz), hAt(lx + 20, lz), hAt(lx - 20, lz), hAt(lx, lz + 20), hAt(lx, lz - 20));
const W = (lx, lz, lift = 0, h = hAt(lx, lz)) => new THREE.Vector3(lx - CX, h * EX + lift, lz - CZ);

function resample(pts, step) {
  const out = [pts[0]];
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i], b = pts[i + 1], L = Math.hypot(b[0] - a[0], b[1] - a[1]), n = Math.max(1, Math.ceil(L / step));
    for (let k = 1; k <= n; k++) out.push([lerp(a[0], b[0], k / n), lerp(a[1], b[1], k / n)]);
  }
  return out;
}

/* =====================================================================
   主程式
   ===================================================================== */
init();
async function init() {
  const [meta, buf, osm] = await Promise.all([
    fetch(DATA + 'meta_r.json').then(r => r.json()), fetch(DATA + 'dem_r.f32').then(r => r.arrayBuffer()), fetch(DATA + 'osm_r.json', { cache: 'no-cache' }).then(r => r.json())]);
  G = { meta, H: new Float32Array(buf) }; OSM = osm;
  CX = (meta.x1 - meta.x0) / 2; CZ = (meta.y1 - meta.y0) / 2;
  setupRenderer();
  const envP = new RGBELoader().loadAsync('assets/hdri/sky_2k.hdr').then(hdr => {
    hdr.mapping = THREE.EquirectangularReflectionMapping;
    scene.background = hdr; scene.backgroundIntensity = 0.95;
    const pm = new THREE.PMREMGenerator(renderer); scene.environment = pm.fromEquirectangular(hdr).texture;
  });
  await Promise.all([envP, buildTerrain()]);
  buildRoute();
  buildLines();
  buildBerm();
  buildDrop();
  buildLabels();
  buildProfile();
  setupUI();
  const q = new URLSearchParams(location.search);
  if (q.get('ex') === '10') setExag(10, false);
  flyTo(q.get('view') || 'overview', 0);
  if (q.get('top')) { const [lx, lz, h] = q.get('top').split(',').map(Number), t = W(lx, lz); controls.target.copy(t); camera.position.set(t.x, t.y + h, t.z + 0.01); controls.update(); }   // 除錯：?top=x,z,高度 正上方往下看（北朝上）
  if (q.get('card')) openPanel(q.get('card'), false);   // 直接打開某張說明卡（連結、截圖用）
  const ld = document.getElementById('loading'); ld.classList.add('done'); setTimeout(() => ld.remove(), 700);
  renderer.setAnimationLoop(frame);
  window.__rg = { scene, camera, controls, flyTo, setExag, FLOW, ROUTE, STOPS, gotoKm, LL, hAt, tick: n => { for (let i = 0; i < n; i++) { stepFlow(1 / 30); controls.update(); } updateLabels(); renderer.render(scene, camera); } };   // 除錯用（視窗隱藏時手動跑）
}

function setupRenderer() {
  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance', logarithmicDepthBuffer: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.85;
  document.getElementById('app').appendChild(renderer.domElement);
  scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0xd3d9db, 16000, 52000);
  camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 5, 120000);
  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.dampingFactor = 0.08;
  controls.maxPolarAngle = Math.PI * 0.495; controls.minDistance = 150; controls.maxDistance = 45000;
  controls.screenSpacePanning = false;
  const sun = new THREE.DirectionalLight(0xfff1dd, 2.4); sun.position.set(-0.55, 0.75, 0.35).multiplyScalar(1000); scene.add(sun);
  scene.add(new THREE.HemisphereLight(0xcfe3ff, 0x6b5a3e, 0.4));
  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight);
    for (const m of lineMats) m.resolution.set(innerWidth, innerHeight);
    drawProfile();
  });
}

/* ---------- 地形（40 m 網格，一張正射影像） ---------- */
async function buildTerrain() {
  const { nx, ny, cell } = G.meta, pos = new Float32Array(nx * ny * 3), uv = new Float32Array(nx * ny * 2);
  for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
    const k = j * nx + i;
    pos[k * 3] = i * cell - CX; pos[k * 3 + 1] = G.H[k]; pos[k * 3 + 2] = j * cell - CZ;
    uv[k * 2] = i / (nx - 1); uv[k * 2 + 1] = 1 - j / (ny - 1);
  }
  const idx = new Uint32Array((nx - 1) * (ny - 1) * 6); let p = 0;
  for (let j = 0; j < ny - 1; j++) for (let i = 0; i < nx - 1; i++) { const a = j * nx + i, b = a + 1, c = a + nx, d = c + 1; idx[p++] = a; idx[p++] = c; idx[p++] = b; idx[p++] = b; idx[p++] = c; idx[p++] = d; }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3)); geo.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  geo.setIndex(new THREE.BufferAttribute(idx, 1)); geo.computeVertexNormals();
  H0 = geo;
  const tex = await new Promise(res => new THREE.TextureLoader().load(DATA + 'ortho_r.jpg', t => { t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 16; res(t); }));
  terrain = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ map: tex, roughness: 0.97 }));
  scene.add(terrain);
}

/* ---------- 跟著水走的路線（OSM 串接）與停靠點 ---------- */
const STOPS = [];
function buildRoute() {
  // 2002 年起水由集集攔河堰經北岸聯絡渠道送來，在「新式分水門」就分給八堡圳和莿仔埤圳（老師現場、《MIT台灣誌》）→ 跟著水走從新式分水門出發，
  // 沿 OSM 八堡圳那一段往西，經過舊的取入口制排水門旁，再接原本的路線
  const pts = [LL(23.8007016, 120.6593767), [16150, 21075], [16131, 21074], [16097, 21076], [16076, 21090], [16070, 21098], [16047, 21119], ...OSM.route], cum = [0];
  for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
  const drainFrom = OSM.routeParts.findIndex(p => p.name === '東溝排水支線');
  const drainIdx = OSM.routeParts[drainFrom - 1].end - 1;          // 路線上「東溝 → 東溝排水支線」改名的點
  ROUTE = { pts, cum, len: cum[cum.length - 1], drainKm: cum[drainIdx] };
  ROUTE.at = s => {                                                  // 距起點 s 公尺處的 [x, z]
    s = clamp(s, 0, ROUTE.len); let lo = 0, hi = cum.length - 1;
    while (hi - lo > 1) { const m = (lo + hi) >> 1; if (cum[m] <= s) lo = m; else hi = m; }
    const t = (s - cum[lo]) / ((cum[hi] - cum[lo]) || 1);
    return [lerp(pts[lo][0], pts[hi][0], t), lerp(pts[lo][1], pts[hi][1], t)];
  };
  ROUTE.near = ([x, z]) => { let b = 1e18, bi = 0; for (let i = 0; i < pts.length; i++) { const d = (pts[i][0] - x) ** 2 + (pts[i][1] - z) ** 2; if (d < b) { b = d; bi = i; } } return cum[bi]; };
  // 停靠點：經緯度依 階段4_史實清單.md
  const S = (key, lat, lon, name, short, color, opt = {}) => { const p = LL(lat, lon); STOPS.push({ key, p, s: ROUTE.near(p), name, short, color, ...opt }); };

/* ---------- 線（Line2，寬度用螢幕像素，遠看也看得到） ---------- */
function makeLine(pts, color, width, opt = {}) {
  const r = resample(pts, 30);
  const geo = new LineGeometry();
  const mat = new LineMaterial({ color, linewidth: width, worldUnits: false, transparent: true, opacity: opt.opacity ?? 1, dashed: !!opt.dashed, dashSize: opt.dash || 120, gapSize: opt.gap || 90, depthTest: true });
  mat.resolution.set(innerWidth, innerHeight); lineMats.push(mat);
  const line = new Line2(geo, mat); line.renderOrder = opt.order || 3;
  const L = { line, geo, r, lift: opt.lift ?? 6, hs: r.map(p => hLine(p[0], p[1])) };
  L.update = () => {
    const arr = []; for (let i = 0; i < r.length; i++) arr.push(r[i][0] - CX, L.hs[i] * EX + L.lift * (EX > 1 ? 2 : 1), r[i][1] - CZ);
    geo.setPositions(arr); line.computeLineDistances();
  };
  L.update(); scene.add(line); lineObjs.push(L);
  return L;
}
let FLOW_LINES = [], NEISAN_MID = null;
function clipRuns(pts) {                  // 只留地形範圍內的部分（OSM 線可能延伸出去）
  const Wd = G.meta.x1 - G.meta.x0, D = G.meta.y1 - G.meta.y0, inside = p => p[0] > 40 && p[0] < Wd - 40 && p[1] > 40 && p[1] < D - 40;
  const runs = []; let cur = [];
  for (const p of resample(pts, 30)) { if (inside(p)) cur.push(p); else { if (cur.length > 1) runs.push(cur); cur = []; } }
  if (cur.length > 1) runs.push(cur);
  return runs;
}
function buildLines() {
  for (const l0 of OSM.lines) for (const pts of clipRuns(l0.pts)) {
    const l = { ...l0, pts };
    if (l.kind === 'rail') { makeLine(l.pts, 0x52525b, 1.6, { opacity: 0.75, dashed: true, dash: 60, gap: 60, lift: 4, order: 2 }); continue; }
    if (l.kind === 'drain') { makeLine(l.pts, DRAIN, 3.2); continue; }
    const one = l.name === '八堡一圳';
    if (l.name === '八堡二圳東溝') {                                  // 改名處以下畫成排水路的顏色
      let run = [], cur = null;
      for (const p of l.pts) { const d = ROUTE.near(p) >= ROUTE.drainKm - 1; if (cur !== null && d !== cur) { run.push(p); if (run.length > 1) makeLine(run, cur ? DRAIN : IRR, cur ? 3.2 : 3.4); run = []; } cur = d; run.push(p); }
      if (run.length > 1) makeLine(run, cur ? DRAIN : IRR, cur ? 3.2 : 3.4);
      continue;
    }
    makeLine(l.pts, one ? IRR1 : IRR, one ? 3 : 3.4);
  }
  // 八堡二圳內三排水：OpenStreetMap 沒有這條線。2026-11-24 依 2023 正射影像（z19）描：從內三放水門往西南西，沿一排樹的直溝走（每往西 100 m 約往南 20 m），畫約 1 公里；
  // 2026-11-19 版「往西略偏北」是我把老師的箭頭看錯方向，已更正
  { const pts = [[10252, 18235], [10150, 18252], [10050, 18275], [9900, 18300], [9750, 18330], [9600, 18368], [9450, 18405], [9300, 18445]];
    makeLine(pts, DRAIN, 2.8, { dashed: true, dash: 90, gap: 70, lift: 7, order: 4 }); NEISAN_MID = pts[4]; }
  // 路線上的流動虛線（水往下游流）：灌溉段藍白、排水段橘白
  const cut = ROUTE.pts.findIndex((_, i) => ROUTE.cum[i] >= ROUTE.drainKm);
  const a = makeLine(ROUTE.pts.slice(0, cut + 1), 0xffffff, 3.2, { dashed: true, dash: 70, gap: 160, lift: 9, order: 5 });
  const b = makeLine(ROUTE.pts.slice(cut), 0xfff4e0, 3.2, { dashed: true, dash: 70, gap: 160, lift: 9, order: 5 });
  FLOW_LINES = [a, b];
}

/* ---------- 浮圳：圳路比兩旁田高
   範圍、高度依內政部 20 m DEM 實測（tools/fuzun_xs.py）：s≈18.1–19.7 km 圳路兩旁比 150–300 m 外的田高約 1.3 m；
   堤頂、堤腳寬度沒有資料（示意）。堤頂高度＝兩側 200 m 外田面平均＋1.3 m，不疊加在已含高地的地形上 ---------- */
function buildBerm() {
  const s0 = 18100, s1 = 19700, P = [], I = [];
  const pts = []; for (let s = s0; s <= s1; s += 15) pts.push(ROUTE.at(s));
  const BH = 1.3, TOP = 8, FOOT = 22, FAR = 200;
  for (let i = 0; i < pts.length; i++) {
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)], dx = b[0] - a[0], dz = b[1] - a[1], L = Math.hypot(dx, dz) || 1, nx = -dz / L, nz = dx / L;
    const [x, z] = pts[i];
    const field = (hAt(x + nx * FAR, z + nz * FAR) + hAt(x - nx * FAR, z - nz * FAR)) / 2;
    const top = Math.max(field + BH, hLine(x, z) + 0.3);
    for (const [o, up] of [[-FOOT / 2, 0], [-TOP / 2, 1], [TOP / 2, 1], [FOOT / 2, 0]]) P.push(x + nx * o, up ? top : hAt(x + nx * o, z + nz * o), z + nz * o, up);
    if (i) { const q = (i - 1) * 4; for (let k = 0; k < 3; k++) I.push(q + k, q + k + 4, q + k + 1, q + k + 1, q + k + 4, q + k + 5); }
  }
  berm = { P, I, mesh: new THREE.Mesh(new THREE.BufferGeometry(), new THREE.MeshStandardMaterial({ color: 0xc4a875, roughness: 1 })) };
  berm.mesh.geometry.setIndex(I); scene.add(berm.mesh); updateBerm();
}
function updateBerm() {
  const { P } = berm, arr = [];
  for (let k = 0; k < P.length; k += 4) arr.push(P[k] - CX, P[k + 1] * EX + (P[k + 3] ? 0.2 : -1), P[k + 2] - CZ);
  berm.mesh.geometry.setAttribute('position', new THREE.Float32BufferAttribute(arr, 3)); berm.mesh.geometry.computeVertexNormals();
}

function buildDrop() {
  dropMesh = new THREE.Mesh(new THREE.SphereGeometry(1, 24, 16), new THREE.MeshStandardMaterial({ color: 0x7dd3fc, emissive: 0x0ea5e9, emissiveIntensity: 1.2, roughness: 0.2 }));
  const c = document.createElement('canvas'); c.width = c.height = 64; const g = c.getContext('2d');
  const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32); gr.addColorStop(0, 'rgba(186,230,253,1)'); gr.addColorStop(0.35, 'rgba(56,189,248,.6)'); gr.addColorStop(1, 'rgba(56,189,248,0)');

const _v = new THREE.Vector3();
function updateLabels() {
  const w = innerWidth, h = innerHeight, rel = camera.position.distanceTo(controls.target);

    _v.copy(L.pos).project(camera);
    const d = camera.position.distanceTo(L.pos);

/* 跌水工示意：取入口 → 林先生廟，5 處跌水工（碑文）；水流越快的地方顏色越紅（示意） */
function dropSVG(on) {
  const H0 = 20, H1 = 92, N = 5, W = 340, x0 = 14;
  let path = `M${x0} ${H0}`, marks = '';
  if (on) { const seg = W / (N + 1), dh = (H1 - H0) / N; let y = H0;
    for (let i = 1; i <= N + 1; i++) { const xe = x0 + seg * i; path += ` L${(xe - 6).toFixed(1)} ${(y + 1.2).toFixed(1)}`; y += 1.2;
      if (i <= N) { path += ` L${xe.toFixed(1)} ${(y + dh - 1.2).toFixed(1)}`; y += dh - 1.2; marks += `<text x="${xe - 3}" y="${y + 10}" font-size="9" fill="#b45309" font-weight="900">跌水</text>`; } } }
  else path += ` L${x0 + W} ${H1}`;
  const col = on ? '#38bdf8' : '#ef4444';
  return `<svg viewBox="0 0 370 118" style="width:100%;height:auto;background:#eef3f6;border-radius:12px;margin:6px 0" role="img" aria-label="圳底剖面">
    <path d="${path} L${x0 + W} 112 L${x0} 112 Z" fill="#c9c2b2"/><path d="${path}" fill="none" stroke="${col}" stroke-width="4"/>${marks}
    <text x="${x0}" y="12" font-size="10" font-weight="900" fill="#0d2238">取入口 約 ${elev('intake')} m</text>
    <text x="${x0 + W}" y="${H1 + 14}" font-size="10" font-weight="900" fill="#0d2238" text-anchor="end">林先生廟 約 ${elev('lin')} m</text>
    <text x="${x0 + W / 2}" y="108" font-size="10.5" font-weight="900" fill="${on ? '#0369a1' : '#b91c1c'}" text-anchor="middle">${on ? '平的地方水流得慢，落差處一次跌下去' : '一路斜下去：水越流越快，沖壞圳底'}</text></svg>`;
}
window.__dropT = on => { const b = document.getElementById('dropBox'); if (b) b.innerHTML = dropSVG(on); document.getElementById('dpOn')?.classList.toggle('on', !!on); document.getElementById('dpOff')?.classList.toggle('on', !on); };

/* =====================================================================
   高度剖面圖（下方）：橫軸＝沿路線距離，縱軸＝DEM 高度
   ===================================================================== */
let PROF;
function buildProfile() {
  const n = 300, s = [], h = [];
  for (let i = 0; i <= n; i++) { const d = ROUTE.len * i / n, p = ROUTE.at(d); s.push(d); h.push(hAt(p[0], p[1])); }
  PROF = { s, h, hmax: 120 };
  document.getElementById('profSvg').addEventListener('click', e => {
    const r = e.currentTarget.getBoundingClientRect(), x = (e.clientX - r.left - PROF.L) / (r.width - PROF.L - PROF.R);
    gotoKm(clamp(x, 0, 1) * ROUTE.len);
  });
  drawProfile();
}
function drawProfile() {
  const svg = document.getElementById('profSvg'), r = svg.getBoundingClientRect(), Wd = r.width, Ht = r.height;
  if (!Wd) return;
  const L = 34, R = 10, T = 6, B = 16; PROF.L = L; PROF.R = R;
  const X = d => L + d / ROUTE.len * (Wd - L - R), Y = hh => T + (1 - hh / PROF.hmax) * (Ht - T - B);
  svg.setAttribute('viewBox', `0 0 ${Wd} ${Ht}`);
  const path = (from, to) => { let a = ''; for (let i = 0; i < PROF.s.length; i++) if (PROF.s[i] >= from - 1 && PROF.s[i] <= to + ROUTE.len / 300) a += `${a ? 'L' : 'M'}${X(PROF.s[i]).toFixed(1)},${Y(PROF.h[i]).toFixed(1)}`; return a; };
  const area = `M${X(0)},${Y(0)}` + path(0, ROUTE.len).replace('M', 'L') + `L${X(ROUTE.len)},${Y(0)}Z`;
  let g = `<path d="${area}" fill="rgba(146,120,80,.28)"/>`;
  for (const v of [0, 50, 100]) g += `<line x1="${L}" x2="${Wd - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="rgba(51,65,85,.18)"/><text x="${L - 4}" y="${Y(v) + 4}" text-anchor="end">${v}</text>`;
  g += `<text x="2" y="${T + 9}" style="font-size:10.5px">公尺</text>`;
  for (let k = 0; k <= ROUTE.len / 1000; k += 5) g += `<text x="${X(k * 1000)}" y="${Ht - 3}" text-anchor="middle">${k} km</text>`;
  g += `<path d="${path(0, ROUTE.drainKm)}" fill="none" stroke="var(--irr)" stroke-width="3.5"/><path d="${path(ROUTE.drainKm, ROUTE.len)}" fill="none" stroke="var(--drain)" stroke-width="3.5"/>`;
  let lastX = -99;
  STOPS.forEach((st, i) => {
    const hh = hAt(st.p[0], st.p[1]), cx = Math.max(X(st.s), lastX + 17), cy = Y(hh) + (cx > X(st.s) + 1 ? 14 : 0); lastX = cx;   // 太近的點往右下錯開，不要疊在一起
    g += `<g style="cursor:pointer" data-k="${st.key}"><circle cx="${cx}" cy="${cy}" r="8" fill="${st.color}" stroke="#fff" stroke-width="1.5"/><text x="${cx}" y="${cy + 4}" text-anchor="middle" style="fill:#fff;font-size:10px">${i + 1}</text></g>`;
  });
  g += `<g id="profDrop"><line y1="${T}" y2="${Ht - B}" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="3 3"/><circle r="6" fill="#7dd3fc" stroke="#0369a1" stroke-width="2"/></g>`;
  svg.innerHTML = g;
  PROF.X = X; PROF.Y = Y;
  // 剖面圖的高度放大倍數＝（每公尺高度的像素）÷（每公尺距離的像素）
  const ex = ((Ht - T - B) / PROF.hmax) / ((Wd - L - R) / ROUTE.len);
  document.getElementById('profEx').textContent = `（這張圖的高度放大約 ${Math.round(ex / 10) * 10} 倍，不然看不出坡度）`;
  updateProfDrop();
}
function updateProfDrop() {
  const el = document.getElementById('profDrop'); if (!el || !PROF.X) return;
  const p = ROUTE.at(FLOW.s), x = PROF.X(FLOW.s), y = PROF.Y(hAt(p[0], p[1]));
  el.querySelector('line').setAttribute('x1', x); el.querySelector('line').setAttribute('x2', x);
  el.querySelector('circle').setAttribute('cx', x); el.querySelector('circle').setAttribute('cy', y);
  el.style.display = FLOW.on || FLOW.s > 0 ? '' : 'none';
}

/* =====================================================================
   跟著水走：水滴沿路線前進，到停靠點暫停並開說明卡，鏡頭跟著
   ===================================================================== */
const FLOW = { on: false, s: 0, speed: 420, next: 0, follow: false };   // speed：畫面上每秒走幾公尺（加快播放）
function startFlow() {
  if (FLOW.s >= ROUTE.len - 1) { FLOW.s = 0; FLOW.next = 0; }
  FLOW.on = true; FLOW.follow = true; dropMesh.visible = dropGlow.visible = true;
  document.getElementById('bFlow').classList.add('on');
  document.getElementById('bFlow').firstChild.textContent = '❚❚ 暫停';
  document.getElementById('panel').classList.remove('open');
  if (FLOW.s === 0) { chase(true); }
}
function pauseFlow(label = '▶ 繼續流') {
  FLOW.on = false; document.getElementById('bFlow').classList.remove('on');
  document.getElementById('bFlow').firstChild.textContent = label;
}
function gotoKm(s) {                       // 點剖面圖：水滴跳到那裡
  FLOW.s = s; FLOW.next = STOPS.findIndex(t => t.s > s + 1); if (FLOW.next < 0) FLOW.next = STOPS.length;
  dropMesh.visible = dropGlow.visible = true; FLOW.follow = true; pauseFlow(); placeDrop(); chase(true);
}
const _prevT = new THREE.Vector3();
function dropPos() { const p = ROUTE.at(FLOW.s); return W(p[0], p[1], 14 * (EX > 1 ? 2 : 1), hLine(p[0], p[1])); }
function placeDrop() {
  const v = dropPos(), d = camera.position.distanceTo(v), sz = clamp(d * 0.011, 8, 260);
  dropMesh.position.copy(v); dropMesh.scale.setScalar(sz); dropGlow.position.copy(v); dropGlow.scale.setScalar(sz * 6);
  updateProfDrop();
}
function chase(jump) {                    // 鏡頭跟著水滴（保留使用者轉過的角度）
  const v = dropPos();
  if (jump) {
    const p = ROUTE.at(FLOW.s), q = ROUTE.at(FLOW.s + 600), dx = q[0] - p[0], dz = q[1] - p[1], L = Math.hypot(dx, dz) || 1;
    const off = new THREE.Vector3(-dx / L * 2200 + dz / L * 900, 1700 + (EX > 1 ? 600 : 0), -dz / L * 2200 - dx / L * 900);
    gsap.to(camera.position, { x: v.x + off.x, y: v.y + off.y, z: v.z + off.z, duration: 1.4, ease: 'power2.inOut' });
    gsap.to(controls.target, { x: v.x, y: v.y, z: v.z, duration: 1.4, ease: 'power2.inOut', onUpdate: () => controls.update(), onComplete: () => _prevT.copy(controls.target) });
    return;
  }
  const d = v.clone().sub(controls.target); controls.target.add(d); camera.position.add(d);
}
function stepFlow(dt) {
  if (!FLOW.on) return;
  const st = STOPS[FLOW.next];
  const ns = FLOW.s + FLOW.speed * dt;
  if (st && ns >= st.s) {
    FLOW.s = st.s; FLOW.next++; placeDrop(); chase(false);
    pauseFlow(); openPanel(st.key, true);
    if (st.key === 'end') document.getElementById('bGo').style.display = 'none';
    return;
  }
  FLOW.s = Math.min(ns, ROUTE.len); placeDrop(); if (FLOW.follow) chase(false);
}

/* ---------- 地勢放大 ---------- */
function setExag(e, anim = true) {
  const apply = v => { EX = v; terrain.scale.y = v; for (const L of lineObjs) L.update(); for (const L of labels) L.update(); updateBerm(); if (dropMesh.visible) placeDrop(); };
  document.getElementById('bExag').classList.toggle('on', e > 1);
  document.getElementById('exagNote').style.display = e > 1 ? 'block' : 'none';
  if (!anim) { apply(e); return; }
  const o = { v: EX }; gsap.to(o, { v: e, duration: 1.0, ease: 'power2.inOut', onUpdate: () => apply(o.v), onComplete: () => apply(e) });
}

/* ---------- 視角 ---------- */
function viewDef(v) {
  const P = (lat, lon) => { const p = LL(lat, lon); return W(p[0], p[1]); };
  if (v === 'head') { const t = P(23.803, 120.640); return { t, p: t.clone().add(new THREE.Vector3(-2600, 2600, 3400)) }; }
  if (v === 'split') { const t = P(23.882, 120.572); return { t, p: t.clone().add(new THREE.Vector3(-1700, 1900, 2600)) }; }
  if (v === 'yong') { const t = P(23.925, 120.560); return { t, p: t.clone().add(new THREE.Vector3(-1600, 2100, 2800)) }; }
  if (v === 'side') { const t = P(23.89, 120.585); return { t, p: t.clone().add(new THREE.Vector3(-17000, 1200, 9500)) }; }   // 從西南方低角度看坡度
  const t = P(23.885, 120.585); return { t, p: t.clone().add(new THREE.Vector3(-6500, 17000, 15500)) };
}
function flyTo(v, dur = 1.8) {
  FLOW.follow = false;
  document.querySelectorAll('.vw').forEach(b => b.classList.toggle('active', b.dataset.v === v));
  const d = viewDef(v);
  if (!dur) { camera.position.copy(d.p); controls.target.copy(d.t); controls.update(); return; }
  gsap.to(camera.position, { x: d.p.x, y: d.p.y, z: d.p.z, duration: dur, ease: 'power2.inOut' });
  gsap.to(controls.target, { x: d.t.x, y: d.t.y, z: d.t.z, duration: dur, ease: 'power2.inOut', onUpdate: () => controls.update() });
}
function setupUI() {
  document.querySelectorAll('.vw').forEach(b => b.addEventListener('click', () => { if (FLOW.on) pauseFlow(); flyTo(b.dataset.v); }));
  document.getElementById('bFlow').addEventListener('click', () => FLOW.on ? pauseFlow() : startFlow());
  document.getElementById('bGo').addEventListener('click', () => { if (FLOW.s < ROUTE.len - 1) { FLOW.follow = true; startFlow(); } });
  document.getElementById('bExag').addEventListener('click', () => setExag(EX > 1 ? 1 : 10));
  document.querySelector('#panel .x').addEventListener('click', () => document.getElementById('panel').classList.remove('open'));
  document.getElementById('profSvg').addEventListener('click', e => { const g = e.target.closest('g[data-k]'); if (g) { e.stopPropagation(); const st = STOPS.find(s => s.key === g.dataset.k); gotoKm(st.s); openPanel(st.key, true); } }, true);
  controls.addEventListener('start', () => { if (FLOW.on) FLOW.follow = true; });
}
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05);
  for (const L of FLOW_LINES) L.line.material.dashOffset -= dt * 260;
  stepFlow(dt);
  if (dropMesh.visible && !FLOW.on) placeDrop();
  controls.update(); updateLabels();
  renderer.render(scene, camera);
}
</script>
<script src="js/nav.js" data-narrow="900" data-narrow-pos="left" defer></script>
</body>
